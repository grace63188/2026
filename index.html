<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辯論場控 · G.R.A.C.E. Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');

:root {
  --bg:       #f4f0e8;
  --bg2:      #ece8df;
  --white:    #ffffff;
  --navy:     #1a2a4a;
  --navy2:    #243258;
  --blue:     #2d5fa8;
  --red:      #7a2020;
  --red2:     #5c1818;
  --gold:     #b8913a;
  --gold2:    #9a7828;
  --pro-icon: #2d6a44;
  --con-icon: #8a2828;
  --text:     #1a1a2e;
  --text-mid: #3a4060;
  --text-dim: #7a8090;
  --border:   rgba(26,42,74,0.12);
  --border-md:rgba(26,42,74,0.2);
  --pro-bg:   #e8f0ec;
  --con-bg:   #f0e8e8;
  --warn:     #c47a1a;
  --danger:   #c02020;
  --green:    #2a7a4a;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans TC',sans-serif; min-height:100vh; }

/* ── NAV ── */
#nav {
  background:var(--bg); border-bottom:1px solid var(--border-md);
  display:grid; grid-template-columns:auto 1fr auto;
  align-items:center; padding:0 32px; height:58px; gap:20px;
}
.nav-logo { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.nav-logo img { height:34px; filter: brightness(0) saturate(100%) invert(18%) sepia(50%) saturate(600%) hue-rotate(195deg) brightness(85%); }
.nav-logo-text { font-size:13px; font-weight:700; color:var(--text); letter-spacing:1px; }
.nav-rounds { display:flex; align-items:stretch; gap:0; justify-content:center; }
.nav-round-btn {
  padding:0 28px; height:58px; background:none; border:none;
  color:var(--text-dim); font-family:inherit; font-size:12px;
  letter-spacing:1px; cursor:pointer; transition:all 0.2s;
  border-bottom:3px solid transparent; border-right:1px solid var(--border);
  text-align:center; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px;
}
.nav-round-btn:first-child { border-left:1px solid var(--border); }
.nav-round-btn:hover { color:var(--navy); background:var(--bg2); }
.nav-round-btn.active { color:var(--white); background:var(--navy); border-bottom-color:var(--gold); }
.nav-round-btn .nr-sub { font-size:9px; color:inherit; opacity:0.6; letter-spacing:1px; }
.nav-round-btn.active .nr-sub { opacity:0.7; }
.nav-right { display:flex; align-items:center; gap:4px; }
.nav-tab {
  padding:8px 18px; background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:12px; letter-spacing:1px; color:var(--text-dim);
  border-bottom:2px solid transparent; transition:all 0.2s;
}
.nav-tab:hover { color:var(--navy); }
.nav-tab.active { color:var(--navy); font-weight:700; border-bottom-color:var(--navy); }

/* ── PAGES ── */
.page { display:none; }
.page.active { display:block; }

/* ════════ ADMIN ════════ */
#page-admin { max-width:860px; margin:0 auto; padding:44px 32px; }
.admin-sec { margin-bottom:40px; }
.sec-title { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--text-dim); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border-md); }
.admin-groups { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
.admin-gc { background:var(--white); border:1px solid var(--border-md); padding:18px; border-radius:6px; }
.admin-gc h3 { font-size:10px; letter-spacing:2px; color:var(--navy); margin-bottom:10px; text-transform:uppercase; }
.admin-gc input { display:block; width:100%; background:var(--bg); border:1px solid var(--border-md); color:var(--text); padding:8px 10px; margin-bottom:6px; font-family:inherit; font-size:13px; border-radius:4px; }
.admin-gc input:focus { outline:none; border-color:var(--blue); }
.topic-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.topic-row input { flex:1; background:var(--white); border:1px solid var(--border-md); color:var(--text); padding:9px 12px; font-family:inherit; font-size:13px; border-radius:4px; }
.topic-row input:focus { outline:none; border-color:var(--blue); }
.mp-card { background:var(--white); border:1px solid var(--border); padding:12px 18px; border-radius:5px; margin-bottom:8px; font-size:13px; color:var(--text-mid); }
.btn { padding:9px 20px; border:none; cursor:pointer; font-family:inherit; font-size:11px; letter-spacing:1px; text-transform:uppercase; border-radius:4px; font-weight:700; transition:all 0.2s; }
.btn-navy { background:var(--navy); color:#fff; }
.btn-navy:hover { background:var(--navy2); }
.btn-outline { background:none; border:1.5px solid var(--border-md); color:var(--text-mid); }
.btn-outline:hover { border-color:var(--navy); color:var(--navy); }
.btn-sm { padding:6px 12px; font-size:10px; }
.btn-del { background:none; border:1px solid var(--border); color:var(--text-dim); font-size:10px; padding:6px 11px; border-radius:4px; cursor:pointer; font-family:inherit; }
.btn-del:hover { border-color:var(--danger); color:var(--danger); }
.save-bar { display:flex; justify-content:flex-end; padding-top:20px; border-top:1px solid var(--border); }

/* ════════ LIVE ════════ */
#page-live { padding:20px 32px; max-width:1280px; margin:0 auto; }

/* TOPIC BANNER */
.topic-banner {
  background:var(--white); border:1px solid var(--border-md);
  border-radius:8px; overflow:hidden; margin-bottom:16px;
}
.tb-main {
  display:flex; align-items:center; gap:18px;
  padding:20px 28px; border-bottom:1px solid var(--border);
}
.tb-num {
  background:var(--navy); color:#fff; padding:8px 18px;
  border-radius:5px; font-size:12px; letter-spacing:2px;
  text-transform:uppercase; font-weight:700; flex-shrink:0;
}
.tb-divider { width:3px; height:40px; background:var(--border-md); border-radius:2px; flex-shrink:0; }
.tb-text { font-size:28px; font-weight:900; color:var(--text); line-height:1.3; }
.tb-text.empty { font-size:16px; color:var(--text-dim); font-weight:400; font-style:italic; }
.tb-stances { display:grid; grid-template-columns:1fr 1fr; }
.tb-stance {
  padding:14px 28px; display:flex; align-items:center; gap:14px;
  border-right:1px solid var(--border);
}
.tb-stance:last-child { border-right:none; }
.tb-stance-icon {
  width:36px; height:36px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; flex-shrink:0;
}
.tb-stance.pro .tb-stance-icon { background:var(--pro-bg); }
.tb-stance.con .tb-stance-icon { background:var(--con-bg); }
.tb-stance-body { }
.tb-stance-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; font-weight:700; margin-bottom:3px; }
.tb-stance.pro .tb-stance-label { color:var(--pro-icon); }
.tb-stance.con .tb-stance-label { color:var(--con-icon); }
.tb-stance-text { font-size:14px; color:var(--text-mid); line-height:1.4; }

/* SIDES */
.sides-row {
  display:grid; grid-template-columns:1fr 52px 1fr;
  align-items:start; gap:12px; margin-bottom:16px;
}
.side-card {
  background:var(--white); border:1.5px solid var(--border-md);
  border-radius:8px; overflow:hidden;
}
.side-card.pro-card { border-color:rgba(45,95,168,0.35); }
.side-card.con-card { border-color:rgba(122,32,32,0.35); }
.side-card-inner {
  display:grid; grid-template-columns:200px 1fr;
  min-height:200px;
}
.side-info {
  padding:20px 22px; border-right:1px solid var(--border);
}
.side-tag-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.side-icon {
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:14px;
}
.pro-card .side-icon { background:var(--pro-bg); }
.con-card .side-icon { background:var(--con-bg); }
.side-tag { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
.pro-card .side-tag { color:var(--pro-icon); }
.con-card .side-tag { color:var(--con-icon); }
.side-stance { font-size:11px; color:var(--text-dim); line-height:1.5; margin-bottom:12px; font-style:italic; }
.side-group { font-size:20px; font-weight:900; margin-bottom:10px; color:var(--text); }
.side-roster { display:flex; flex-direction:column; gap:5px; }
.side-rr { display:flex; align-items:center; gap:8px; }
.side-role { font-size:9px; letter-spacing:2px; color:var(--text-dim); min-width:28px; text-transform:uppercase; }
.side-member { font-size:14px; font-weight:700; color:var(--text); }

.side-points { padding:20px 22px; }
.side-points-label {
  font-size:9px; letter-spacing:3px; text-transform:uppercase; font-weight:700;
  margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid;
}
.pro-card .side-points-label { color:var(--pro-icon); border-color:var(--pro-icon); }
.con-card .side-points-label { color:var(--con-icon); border-color:var(--con-icon); }
.pt-row { display:flex; gap:10px; align-items:flex-start; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.pt-row:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
.pt-icon {
  width:32px; height:32px; border-radius:6px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:14px;
}
.pro-card .pt-icon { background:var(--pro-bg); }
.con-card .pt-icon { background:var(--con-bg); }
.pt-body { }
.pt-tag { font-size:12px; font-weight:700; margin-bottom:2px; }
.pro-card .pt-tag { color:var(--pro-icon); }
.con-card .pt-tag { color:var(--con-icon); }
.pt-text { font-size:13px; color:var(--text-mid); line-height:1.5; }

.vs-circle {
  width:52px; height:52px; border:2px solid var(--border-md); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; letter-spacing:2px; color:var(--text-dim); font-weight:700;
  align-self:center; margin-top:60px;
}

/* FLOW TIMELINE */
.flow-row {
  display:flex; align-items:center; margin-bottom:16px;
  background:var(--white); border:1px solid var(--border-md); border-radius:8px; padding:0 16px;
}
.flow-label {
  font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim);
  white-space:nowrap; padding:16px 14px 16px 0; border-right:1px solid var(--border);
  margin-right:14px; flex-shrink:0;
}
.flow-steps { display:flex; align-items:center; flex:1; padding:12px 0; gap:0; justify-content:space-between; }
.flow-step {
  display:flex; flex-direction:column; align-items:center;
  cursor:pointer; flex-shrink:0; position:relative;
}
.flow-step-bubble {
  width:44px; height:44px; border-radius:50%; border:2px solid var(--border-md);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--white); transition:all 0.2s; font-size:8px; color:var(--text-dim);
  font-weight:700; letter-spacing:0.5px;
}
.flow-step.active .flow-step-bubble {
  background:var(--navy); border-color:var(--navy); color:#fff;
}
.flow-step.done .flow-step-bubble {
  background:var(--green); border-color:var(--green); color:#fff;
}
.flow-step-name { font-size:10px; color:var(--text-mid); margin-top:5px; text-align:center; font-weight:600; white-space:nowrap; }
.flow-step.active .flow-step-name { color:var(--navy); font-weight:700; }
.flow-step.done .flow-step-name { color:var(--green); }
.flow-step-time { font-size:9px; color:var(--text-dim); text-align:center; }
.flow-dash {
  height:2px; flex:1; border-top:2px dashed var(--border-md);
  align-self:center; margin-bottom:28px; min-width:12px;
}

/* TIMER ZONE */
.timer-zone {
  background:var(--white); border:1.5px solid var(--border-md);
  border-radius:8px; overflow:hidden;
}
.timer-zone-inner {
  display:grid; grid-template-columns:240px 1fr auto;
  align-items:center; min-height:120px;
}
.tz-side {
  padding:22px 24px; border-right:1px solid var(--border);
  display:flex; align-items:flex-start; gap:12px;
}
.tz-side-icon {
  width:38px; height:38px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:16px;
}
.tz-side.pro-tz .tz-side-icon { background:var(--pro-bg); }
.tz-side.con-tz .tz-side-icon { background:var(--con-bg); }
.tz-side-body { }
.tz-side-label { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
.tz-side.pro-tz .tz-side-label { color:var(--pro-icon); }
.tz-side.con-tz .tz-side-label { color:var(--con-icon); }
.tz-side-stance { font-size:12px; color:var(--text-dim); line-height:1.5; }
.tz-center {
  padding:20px 28px; text-align:center;
}
.tz-speaker-label { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px; }
.tz-speaker { font-size:22px; font-weight:900; color:var(--text); margin-bottom:3px; }
.tz-step { font-size:12px; color:var(--text-dim); letter-spacing:1px; }
.tz-bar-wrap { height:3px; background:var(--bg2); border-radius:2px; margin-top:14px; overflow:hidden; }
.tz-bar { height:100%; background:var(--blue); border-radius:2px; transition:width 0.9s linear, background 0.4s; }
.tz-bar.warn { background:var(--warn); }
.tz-bar.danger { background:var(--danger); }
.tz-time-wrap {
  padding:22px 32px; border-left:1px solid var(--border);
  text-align:center; min-width:200px;
}
.tz-time {
  font-size:80px; font-weight:900; line-height:1;
  font-variant-numeric:tabular-nums; letter-spacing:-2px;
  color:var(--navy); transition:color 0.4s;
}
.tz-time.warn { color:var(--warn); }
.tz-time.danger { color:var(--danger); animation:blink 0.5s ease-in-out infinite alternate; }
.tz-time.judge-warn { color:var(--warn); }
.tz-time.judge-danger { color:var(--danger); }
@keyframes blink { from{opacity:1} to{opacity:0.45} }

/* CONTROLS */
.controls-row {
  display:flex; justify-content:center; gap:12px; margin-top:16px; flex-wrap:wrap;
}
.ctrl-btn {
  padding:13px 32px; border:none; cursor:pointer; font-family:inherit;
  font-size:13px; font-weight:700; border-radius:6px; transition:all 0.2s;
  display:flex; align-items:center; gap:8px; letter-spacing:1px;
}
.ctrl-start { background:var(--navy); color:#fff; }
.ctrl-start:hover { background:var(--navy2); }
.ctrl-pause { background:none; border:1.5px solid var(--warn); color:var(--warn); }
.ctrl-pause:hover { background:rgba(196,122,26,0.07); }
.ctrl-reset { background:none; border:1.5px solid var(--border-md); color:var(--text-mid); }
.ctrl-reset:hover { background:var(--bg2); }
.ctrl-next { background:var(--gold); color:#fff; }
.ctrl-next:hover { background:var(--gold2); }

/* FREE DEBATE */
.fd-zone { display:none; }
.fd-zone.vis { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.fd-card {
  background:var(--white); border:1.5px solid var(--border-md);
  border-radius:8px; padding:18px 22px; transition:all 0.25s;
}
.fd-card.pro-fd { border-color:rgba(45,95,168,0.3); }
.fd-card.con-fd { border-color:rgba(122,32,32,0.3); }
.fd-card.active-fd.pro-fd { background:var(--navy); border-color:var(--navy); }
.fd-card.active-fd.con-fd { background:var(--red2); border-color:var(--red2); }
.fd-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.fd-tag { font-size:9px; letter-spacing:3px; text-transform:uppercase; font-weight:700; }
.fd-card.pro-fd .fd-tag { color:var(--pro-icon); }
.fd-card.con-fd .fd-tag { color:var(--con-icon); }
.fd-card.active-fd .fd-tag { color:rgba(255,255,255,0.6); }
.fd-total { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
.fd-card.active-fd .fd-total { color:#fff; }
.fd-total.warn { color:var(--warn); }
.fd-total.danger { color:var(--danger); }
.fd-grp { font-size:15px; font-weight:800; margin-bottom:10px; }
.fd-card.active-fd .fd-grp { color:#fff; }
.fd-speech-time {
  font-size:52px; font-weight:900; text-align:center; line-height:1;
  font-variant-numeric:tabular-nums; transition:color 0.3s;
}
.fd-card.active-fd .fd-speech-time { color:#fff; }
.fd-speech-time.warn { color:var(--warn) !important; }
.fd-speech-time.danger { color:var(--danger) !important; animation:blink 0.5s ease-in-out infinite alternate; }
.fd-bar-wrap { height:3px; background:var(--bg2); border-radius:2px; margin-top:8px; overflow:hidden; }
.fd-card.active-fd .fd-bar-wrap { background:rgba(255,255,255,0.15); }
.fd-bar { height:100%; background:var(--blue); border-radius:2px; transition:width 0.9s linear; }
.fd-bar.warn { background:var(--warn); }
.fd-bar.danger { background:var(--danger); }
.fd-btns { display:flex; justify-content:center; gap:10px; margin-bottom:14px; }
.fd-btn {
  padding:10px 20px; border-radius:5px; cursor:pointer; font-family:inherit;
  font-size:11px; letter-spacing:1px; text-transform:uppercase; font-weight:700;
  transition:all 0.2s; border:1.5px solid var(--border-md); background:var(--white); color:var(--text);
}
.fd-btn:hover:not(:disabled) { background:var(--bg); }
.fd-btn.pro-fb { border-color:var(--blue); color:var(--blue); }
.fd-btn.con-fb { border-color:var(--red); color:var(--red); }
.fd-btn:disabled { opacity:0.3; cursor:not-allowed; }

/* DRAW PHASE */
#draw-phase { }
.draw-actions { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:16px; }
.d-btn {
  padding:12px 24px; border:none; cursor:pointer; font-family:inherit;
  font-size:12px; font-weight:700; border-radius:6px; transition:all 0.2s; letter-spacing:1px;
}
.d-btn:disabled { opacity:0.3; cursor:not-allowed; }
.d-btn-primary { background:var(--navy); color:#fff; }
.d-btn-primary:not(:disabled):hover { background:var(--navy2); }
.d-btn-sec { background:var(--white); border:1.5px solid var(--border-md); color:var(--text); }
.d-btn-sec:not(:disabled):hover { border-color:var(--navy); color:var(--navy); }
.d-btn-go { background:var(--gold); color:#fff; }
.d-btn-go:not(:disabled):hover { background:var(--gold2); }
.observer-strip {
  background:var(--white); border:1px solid var(--border); padding:12px 20px;
  border-radius:6px; text-align:center; margin-bottom:14px;
  font-size:13px; color:var(--text-mid);
}
.obs-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--text-dim); margin-bottom:4px; }

/* inline-topics removed */
.it-card { background:var(--white); border:1px solid var(--border-md); border-radius:8px; overflow:hidden; margin-bottom:16px; }
.it-header { background:var(--navy); padding:16px 24px; display:flex; align-items:center; gap:16px; }
.it-num { background:rgba(255,255,255,0.15); color:#fff; padding:5px 14px; border-radius:4px; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; flex-shrink:0; }
.it-title { font-size:20px; font-weight:800; color:#fff; line-height:1.4; }
.it-stances { display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--border); }
.it-stance { padding:14px 22px; border-right:1px solid var(--border); }
.it-stance:last-child { border-right:none; }
.it-stance.pro { background:var(--pro-bg); }
.it-stance.con { background:var(--con-bg); }
.it-stance-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; font-weight:700; margin-bottom:4px; }
.it-stance.pro .it-stance-label { color:var(--pro-icon); }
.it-stance.con .it-stance-label { color:var(--con-icon); }
.it-stance-text { font-size:13px; color:var(--text-mid); line-height:1.5; font-style:italic; }
.it-points-wrap { display:grid; grid-template-columns:1fr 1fr; }
.it-col { padding:18px 22px; border-right:1px solid var(--border); }
.it-col:last-child { border-right:none; }
.it-col-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; font-weight:700; margin-bottom:12px; padding-bottom:7px; border-bottom:2px solid; }
.it-col.pro .it-col-label { color:var(--pro-icon); border-color:var(--pro-icon); }
.it-col.con .it-col-label { color:var(--con-icon); border-color:var(--con-icon); }
.it-pt { display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.it-pt:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
.it-pt-icon { width:30px; height:30px; border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; }
.it-col.pro .it-pt-icon { background:var(--pro-bg); }

.modal-box { background:var(--bg); border:1px solid var(--border-md); border-radius:10px; padding:40px 44px; max-width:460px; width:92%; text-align:center; box-shadow:0 24px 80px rgba(10,18,40,0.2); }
.m-eye { font-size:9px; letter-spacing:5px; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; }
.m-ttl { font-size:22px; font-weight:900; color:var(--text); margin-bottom:4px; }
.slot-container { margin:20px auto; max-width:300px; }
.slot-row { display:flex; align-items:center; gap:10px; background:var(--white); border:1px solid var(--border-md); border-radius:5px; padding:10px 14px; margin-bottom:6px; height:48px; overflow:hidden; }
.slot-role-tag { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--text-dim); min-width:32px; flex-shrink:0; }
.slot-name-wrap { flex:1; overflow:hidden; position:relative; height:24px; }
.slot-name { font-size:16px; font-weight:700; color:var(--text); position:absolute; left:0; right:0; }
.slot-name.spinning { animation:slot-spin 0.07s linear infinite; color:var(--blue); }
@keyframes slot-spin { 0%{transform:translateY(0);opacity:1} 49%{transform:translateY(-12px);opacity:0} 50%{transform:translateY(12px);opacity:0} 100%{transform:translateY(0);opacity:1} }
.slot-check { font-size:14px; color:var(--green); opacity:0; transition:opacity 0.3s; }
.slot-check.vis { opacity:1; }
.m-note { font-size:12px; color:var(--text-dim); margin:12px 0 24px; line-height:1.7; }
.m-btns { display:flex; gap:8px; justify-content:center; }
.conflict-warn { background:#fff8e6; border:1px solid #e8c050; border-radius:5px; padding:10px 14px; font-size:12px; color:#7a5a10; margin-top:8px; text-align:left; line-height:1.5; }

/* Toast */
#toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 22px; font-size:12px; font-weight:600; border-radius:5px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:300; }
#toast.show { opacity:1; }
</style>

<script>
// ══ LOGO ══
document.getElementById('logo-img').src='data:image/jpeg;base64,LOGO_B64_HERE';

// ══ DATA ══
const DEFAULT_CFG={
  groups:[
    {name:'第一組',members:['謝蕎伊','黃又庭','蔡芷芸']},
    {name:'第二組',members:['倪婍瑄','朱映蓉','賴又嘉']},
    {name:'第三組',members:['田慧琳','陳怡伶','宋雨璇']}
  ],
  topics:[
    '女人有能力賺錢，就不應該依賴另一半',
    '一個無法帶給你正向啟發的人，那都是假感情',
    '在感情裡，對方不支持你的選擇，比出軌更值得離開'
  ]
};

const PT_ICONS=['⚖️','👤','💛','🔺','⚠️','📊'];
const TD=[
  {
    pro_stance:'有能力不代表有義務，依賴是個人的選擇與自由',
    con_stance:'有能力就有責任對等承擔，長期失衡讓關係脆弱',
    pro:[{tag:'依賴定義',text:'依賴是主動的選擇，與能力高低無關'},{tag:'選擇自由',text:'有能力不代表有義務，選擇依賴是個人的權利'},{tag:'關係分工',text:'感情裡的依賴是信任的體現，不是弱點'}],
    con:[{tag:'對等原則',text:'能力對等是健康關係的基礎，失衡會造成控制'},{tag:'風險意識',text:'完全依賴讓自己失去主動權，一旦關係破裂代價極高'},{tag:'長期影響',text:'依賴會讓個人成長停滯，影響自我價值感'}]
  },
  {
    pro_stance:'真正的感情會讓你成為更好的人，帶不來成長的關係只是消耗',
    con_stance:'感情的本質是陪伴與接納，不是每段關係都需要帶來啟發才算真實',
    pro:[{tag:'感情本質',text:'真正的感情會讓你想成為更好的人，而不是停在原地'},{tag:'長期消耗',text:'無法啟發你的關係會讓你慢慢失去成長的方向'},{tag:'真實的愛',text:'愛一個人包括希望彼此都在進步，而不只是舒適共存'}],
    con:[{tag:'陪伴價值',text:'感情的核心是接納與陪伴，不是每段關係都需要帶來啟發'},{tag:'啟發定義',text:'啟發不等於成長壓力，穩定的支持本身也是一種正向力量'},{tag:'關係彈性',text:'用啟發作為衡量標準，會讓感情變成一種績效評估'}]
  },
  {
    pro_stance:'長期不被支持是慢性消耗，比一次背叛更難復原',
    con_stance:'出軌是對承諾的直接破壞，不支持可以溝通成長',
    pro:[{tag:'精神層面',text:'長期不被支持是慢性消耗，比一次背叛更難復原'},{tag:'核心需求',text:'感情的本質是看見彼此，不支持等於否定你這個人'},{tag:'方向分歧',text:'不支持意味著兩個人走向不同的未來，這是根本問題'}],
    con:[{tag:'承諾破壞',text:'出軌是對關係承諾的直接破壞，性質不同於意見分歧'},{tag:'可修復性',text:'不支持可以溝通、可以成長，但信任一旦破裂難以修復'},{tag:'標準混淆',text:'把選擇上的分歧等同於背叛，會讓關係失去彈性空間'}]
  }
];
const MATCHUPS=[{g1:0,g2:1,watch:2},{g1:1,g2:2,watch:0},{g1:2,g2:0,watch:1}];
const CN=['一','二','三'];

function fmtName(n){if(!n)return'';const t=n.trim();return(t.length<=2?t:t.slice(-2))+'學姊';}
function buildFlow(){
  return[
    {id:'p1',label:'正方一辯',sub:'立論陳詞',side:'pro',secs:120},
    {id:'c1',label:'反方一辯',sub:'立論陳詞',side:'con',secs:120},

    {id:'p3',label:'正方三辯',sub:'結辯總結',side:'pro',secs:120},
    {id:'judge',label:'結束總評',sub:'',side:'judge',secs:180}
  ];
}

// ── STATE ──
let cfg=loadCfg();
let rounds=[0,1,2].map(()=>({topic:null,topicIdx:null,proGrpIdx:null,conGrpIdx:null,proRoles:[],conRoles:[],drawStage:'none',started:false}));
let usedTopicIdxs=[];
let memberUsedRoles={};
let curRound=0;
let tIv=null,tRun=false,tLeft=0,tTotal=0,isJudge=false;
let stepIdx=0,steps=[],stepsDone=[];
let fdIv=null,fdRun=false,fdSide=null,fdProTotal=120,fdConTotal=120,fdSpeechLeft=30;

function loadCfg(){try{const s=localStorage.getItem('gd7');return s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_CFG));}catch(e){return JSON.parse(JSON.stringify(DEFAULT_CFG));}}
function saveCfgStore(){localStorage.setItem('gd7',JSON.stringify(cfg));}
function fmt(s){if(s<0)s=0;const m=Math.floor(s/60);return`${m}:${(s%60).toString().padStart(2,'0')}`;}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
let _tid;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tid);_tid=setTimeout(()=>t.classList.remove('show'),2400);}
let actx=null;
function audio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function beep(f,d,v){try{const c=audio(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(v||0.22,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);o.start();o.stop(c.currentTime+d);}catch(e){}}
function warnBeep(){beep(800,0.1,0.16);setTimeout(()=>beep(800,0.1,0.16),170);}
function endBeep(){beep(440,0.22,0.28);setTimeout(()=>beep(330,0.35,0.28),280);}
function drawBeep(){beep(660,0.09,0.16);setTimeout(()=>beep(880,0.13,0.2),110);}

// ── NAV ──
function switchPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.nav-tab')[p==='live'?0:1].classList.add('active');
  if(p==='admin')renderAdmin();
}

// ── ADMIN ──
function renderAdmin(){
  const ag=document.getElementById('admin-groups');ag.innerHTML='';
  cfg.groups.forEach((g,gi)=>{
    const c=document.createElement('div');c.className='admin-gc';
    c.innerHTML=`<h3>${g.name}</h3>`;
    [0,1,2].forEach(i=>{const inp=document.createElement('input');inp.type='text';inp.value=g.members[i]||'';inp.placeholder=`成員 ${i+1}`;c.appendChild(inp);});
    ag.appendChild(c);
  });
  const at=document.getElementById('admin-topics');at.innerHTML='';
  cfg.topics.forEach(t=>addTopicRow(t));
  const am=document.getElementById('admin-matchup');am.innerHTML='';
  MATCHUPS.forEach((m,i)=>{
    const d=document.createElement('div');d.className='mp-card';
    d.innerHTML=`<strong>第 ${i+1} 場</strong>　${cfg.groups[m.g1]?.name||'?'} vs ${cfg.groups[m.g2]?.name||'?'}（持方現場抽）　｜　觀戰：${cfg.groups[m.watch]?.name||'?'}`;
    am.appendChild(d);
  });
}
function addTopicRow(val){
  const at=document.getElementById('admin-topics');
  const r=document.createElement('div');r.className='topic-row';
  r.innerHTML=`<input type="text" class="topic-inp" value="${val||''}" placeholder="輸入辯題…"><button class="btn-del" onclick="this.parentElement.remove()">移除</button>`;
  at.appendChild(r);
}
function saveConfig(){
  document.querySelectorAll('.admin-gc').forEach((c,gi)=>{
    cfg.groups[gi].members=[...c.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);
  });
  cfg.topics=[...document.querySelectorAll('.topic-inp')].map(i=>i.value.trim()).filter(Boolean);
  saveCfgStore();toast('設定已儲存');
}

// ── ROUND BAR ──
function renderRoundBar(){
  const rb=document.getElementById('nav-rounds');rb.innerHTML='';
  [0,1,2].forEach(i=>{
    const rs=rounds[i];
    const sub=rs.started?'辯論中':rs.drawStage==='con'?'已完成抽籤':rs.drawStage==='pro'?'已抽正方':rs.drawStage==='topic'?'已抽辯題':'待抽籤';
    const btn=document.createElement('button');
    btn.className='nav-round-btn'+(i===curRound?' active':'');
    btn.innerHTML=`第 ${i+1} 場<span class="nr-sub">${sub}</span>`;
    btn.onclick=()=>switchRound(i);
    rb.appendChild(btn);
  });
}
function switchRound(i){curRound=i;stopAll();renderRoundBar();renderRound();}
function renderRound(){const rs=rounds[curRound];if(rs.started)showDebate();else showDraw();}

// ── DRAW ──
function showDraw(){
  document.getElementById('draw-phase').style.display='block';
  document.getElementById('debate-phase').style.display='none';
  renderDrawUI();
}

function renderDrawUI(){
  const rs=rounds[curRound];
  const mu=MATCHUPS[curRound];
  const wg=cfg.groups[mu.watch];
  document.getElementById('obs-name').textContent=wg?`${wg.name}（${wg.members.map(fmtName).join('、')}）`:'—';

  // Topic banner
  const tbText=document.getElementById('tb-text');
  const tbStances=document.getElementById('tb-stances');
  const tbNum=document.getElementById('tb-num');
  if(rs.topic){
    tbText.textContent=rs.topic;tbText.classList.remove('empty');
    tbNum.textContent=`辯題${CN[rs.topicIdx]||''}`;
    if(rs.topicIdx!=null&&TD[rs.topicIdx]){
      const td=TD[rs.topicIdx];
      document.getElementById('tb-pro-stance').textContent=td.pro_stance;
      document.getElementById('tb-con-stance').textContent=td.con_stance;
      tbStances.style.display='grid';
    }
  } else {
    tbText.textContent='尚未抽出辯題';tbText.classList.add('empty');
    tbNum.textContent='本場辯題';tbStances.style.display='none';
  }

  // Side cards
  renderDrawSide('pro',rs);
  renderDrawSide('con',rs);

  // Show points ONLY after topic drawn AND that side drawn
  const hasTopic = rs.topic && rs.topicIdx!=null && TD[rs.topicIdx];
  const proDrawn = rs.drawStage==='pro'||rs.drawStage==='con';
  const conDrawn = rs.drawStage==='con';
  const td_draw = hasTopic ? TD[rs.topicIdx] : null;

  if(hasTopic && proDrawn && td_draw){
    renderPointsInCard('draw-pro-points','正方論點',td_draw.pro,'pro');
    const proStanceEl = document.getElementById('draw-pro-stance');
    if(proStanceEl){ proStanceEl.textContent=td_draw.pro_stance; proStanceEl.style.display='block'; }
  } else {
    const proPointsEl = document.getElementById('draw-pro-points');
    if(proPointsEl) proPointsEl.innerHTML='<div class="side-points-label">正方論點</div><div style="color:var(--text-dim);font-size:12px;font-style:italic">抽出辯題後顯示</div>';
    const proStanceEl = document.getElementById('draw-pro-stance');
    if(proStanceEl) proStanceEl.style.display='none';
  }

  if(hasTopic && conDrawn && td_draw){
    renderPointsInCard('draw-con-points','反方論點',td_draw.con,'con');
    const conStanceEl = document.getElementById('draw-con-stance');
    if(conStanceEl){ conStanceEl.textContent=td_draw.con_stance; conStanceEl.style.display='block'; }
  } else {
    const conPointsEl = document.getElementById('draw-con-points');
    if(conPointsEl) conPointsEl.innerHTML='<div class="side-points-label">反方論點</div><div style="color:var(--text-dim);font-size:12px;font-style:italic">抽出辯題後顯示</div>';
    const conStanceEl = document.getElementById('draw-con-stance');
    if(conStanceEl) conStanceEl.style.display='none';
  }

  document.getElementById('btn-topic').disabled=!!rs.topic;
  document.getElementById('btn-pro').disabled=!rs.topic||rs.drawStage==='pro'||rs.drawStage==='con';
  document.getElementById('btn-con').disabled=rs.drawStage!=='pro';
  document.getElementById('btn-go').disabled=rs.drawStage!=='con';

}

function renderPointsInCard(elId,label,points,side){
  const el=document.getElementById(elId);
  const colorClass=side==='pro'?'pro-card':'con-card';
  el.innerHTML=`<div class="side-points-label">${label}</div>`+
    points.map((p,i)=>`
      <div class="pt-row">
        <div class="pt-icon">${['⚖️','👤','💛','🔺','⚠️','📊'][i]||'•'}</div>
        <div class="pt-body">
          <div class="pt-tag">${p.tag}</div>
          <div class="pt-text">${p.text}</div>
        </div>
      </div>`).join('');
  // Apply color to tags based on side
  el.querySelectorAll('.pt-tag').forEach(t=>t.style.color=side==='pro'?'var(--pro-icon)':'var(--con-icon)');
  el.querySelectorAll('.pt-icon').forEach(i=>i.style.background=side==='pro'?'var(--pro-bg)':'var(--con-bg)');
}

function renderDrawSide(side,rs){
  const drawn=(side==='pro'&&(rs.drawStage==='pro'||rs.drawStage==='con'))||(side==='con'&&rs.drawStage==='con');
  const gIdx=side==='pro'?rs.proGrpIdx:rs.conGrpIdx;
  const grp=gIdx!=null?cfg.groups[gIdx]:null;
  const roles=side==='pro'?rs.proRoles:rs.conRoles;
  const labels=['一辯','二辯','三辯'];

  document.getElementById(`draw-${side}-group`).textContent=drawn&&grp?grp.name:'—';
  const rosterEl=document.getElementById(`draw-${side}-roster`);
  rosterEl.innerHTML=labels.map((l,ri)=>`
    <div class="side-rr">
      <span class="side-role">${l}</span>
      <span class="side-member" style="${drawn?'':'color:var(--text-dim)'}">${drawn&&grp?fmtName(grp.members[roles[ri]]):'—'}</span>
    </div>`).join('');
}

// ── DRAW TOPIC ──
function drawTopic(){
  const available=cfg.topics.map((t,i)=>({t,i})).filter(x=>!usedTopicIdxs.includes(x.i));
  if(!available.length){toast('辯題已用完');return;}
  const chosen=available[Math.floor(Math.random()*available.length)];
  const el=document.getElementById('tb-text');
  el.classList.remove('empty');
  let tick=0;
  const iv=setInterval(()=>{
    el.textContent=available[Math.floor(Math.random()*available.length)].t;
    el.style.opacity=tick%2?'0.5':'0.9';tick++;
    if(tick>18){
      clearInterval(iv);el.style.opacity='1';
      rounds[curRound].topic=chosen.t;rounds[curRound].topicIdx=chosen.i;
      usedTopicIdxs.push(chosen.i);
      beep(660,0.2,0.28);renderRoundBar();renderDrawUI();
    }
  },80);
}

// ── DRAW SIDE ──
function drawSide(side){
  const rs=rounds[curRound];const mu=MATCHUPS[curRound];
  let gIdx;
  if(side==='pro'){
    gIdx=Math.random()<0.5?mu.g1:mu.g2;
    rs.proGrpIdx=gIdx;rs.conGrpIdx=(gIdx===mu.g1)?mu.g2:mu.g1;
  } else { gIdx=rs.conGrpIdx; }
  const grp=cfg.groups[gIdx];if(!grp){toast('群組設定有誤');return;}
  const members=grp.members;
  const usedByMember=members.map(m=>memberUsedRoles[m]||new Set());
  const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
  const valid=perms.filter(p=>p.every((mi,ri)=>!usedByMember[mi].has(ri)));
  let assignment,hasConflict=false;
  if(valid.length>0){assignment=valid[Math.floor(Math.random()*valid.length)];}
  else{hasConflict=true;assignment=shuffle([0,1,2]);}
  showSlotModal((side==='pro'?'正方':'反方')+'抽籤',grp.name,members,['一辯','二辯','三辯'],assignment,hasConflict,()=>{
    assignment.forEach((mi,ri)=>{const nm=members[mi];if(!memberUsedRoles[nm])memberUsedRoles[nm]=new Set();memberUsedRoles[nm].add(ri);});
    if(side==='pro'){rs.proRoles=assignment;rs.drawStage='pro';}
    else{rs.conRoles=assignment;rs.drawStage='con';}
    closeModal();renderRoundBar();renderDrawUI();
  });
}

function showSlotModal(eye,title,members,roleLabels,finalOrder,hasConflict,onConfirm){
  document.getElementById('m-eye').textContent=eye;
  document.getElementById('m-ttl').textContent=title;
  document.getElementById('m-note').innerHTML=hasConflict?'<div class="conflict-warn">⚠️ 部分學姊已在其他場次擔任相同辯位，此次採備用隨機分配。</div>':'';
  document.getElementById('m-btns').innerHTML='';
  const sc=document.getElementById('m-slots');sc.innerHTML='';
  let done=0;
  roleLabels.forEach((label,ri)=>{
    const row=document.createElement('div');row.className='slot-row';
    row.innerHTML=`<span class="slot-role-tag">${label}</span><div class="slot-name-wrap"><span class="slot-name spinning" id="sn-${ri}">?</span></div><span class="slot-check" id="sc-${ri}">✓</span>`;
    sc.appendChild(row);
  });
  document.getElementById('modal').classList.add('open');
  roleLabels.forEach((_,ri)=>{
    setTimeout(()=>{
      const el=document.getElementById('sn-'+ri);const ck=document.getElementById('sc-'+ri);
      let ticks=0;const total=20+ri*10;
      const iv=setInterval(()=>{
        el.textContent=fmtName(members[Math.floor(Math.random()*members.length)]);ticks++;
        if(ticks>=total){
          clearInterval(iv);el.textContent=fmtName(members[finalOrder[ri]]);
          el.classList.remove('spinning');ck.classList.add('vis');drawBeep();done++;
          if(done===roleLabels.length){
            setTimeout(()=>{
              const btn=document.createElement('button');btn.className='btn btn-navy';
              btn.textContent='確認抽籤結果';btn.onclick=onConfirm;
              document.getElementById('m-btns').appendChild(btn);
            },300);
          }
        }
      },70);
    },ri*440);
  });
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function startDebate(){rounds[curRound].started=true;renderRoundBar();showDebate();}
function backToDraw(){stopAll();document.getElementById('draw-phase').style.display='block';document.getElementById('debate-phase').style.display='none';renderDrawUI();}

// ── DEBATE ──
function showDebate(){
  document.getElementById('draw-phase').style.display='none';
  document.getElementById('debate-phase').style.display='block';
  const rs=rounds[curRound];
  const proGrp=cfg.groups[rs.proGrpIdx];
  const conGrp=cfg.groups[rs.conGrpIdx];
  const td=rs.topicIdx!=null?TD[rs.topicIdx]:null;
  const roleLabels=['一辯','二辯','三辯'];

  // Topic banner
  document.getElementById('dtb-num').textContent=`辯題${CN[rs.topicIdx]||''}`;
  document.getElementById('dtb-text').textContent=rs.topic||'—';
  if(td){document.getElementById('dtb-pro-stance').textContent=td.pro_stance;document.getElementById('dtb-con-stance').textContent=td.con_stance;}

  // Side info
  function buildSideInfo(grp,roles,isProSide){
    if(!grp)return'';
    const stance=td?(isProSide?td.pro_stance:td.con_stance):'';
    return`
      <div class="side-tag-row">
        <div class="side-icon">${isProSide?'🛡':'⚔️'}</div>
        <span class="side-tag">${isProSide?'正方':'反方'}</span>
      </div>
      ${stance?`<div class="side-stance">${stance}</div>`:''}
      <div class="side-group">${grp.name}</div>
      <div class="side-roster">${roleLabels.map((r,i)=>`<div class="side-rr"><span class="side-role">${r}</span><span class="side-member">${fmtName(grp.members[roles[i]])}</span></div>`).join('')}</div>`;
  }
  document.getElementById('debate-pro-info').innerHTML=buildSideInfo(proGrp,rs.proRoles,true);
  document.getElementById('debate-con-info').innerHTML=buildSideInfo(conGrp,rs.conRoles,false);

  // Points
  if(td){
    renderDebatePoints('debate-pro-points','正方論點',td.pro,'pro');
    renderDebatePoints('debate-con-points','反方論點',td.con,'con');
  }

  // FD grp names
  document.getElementById('fd-pro-grp').textContent=proGrp?.name||'正方';
  document.getElementById('fd-con-grp').textContent=conGrp?.name||'反方';

  // Timer side stance
  updateTzSide('pro',proGrp,td?td.pro_stance:'');

  steps=buildFlow();
  steps.forEach(s=>{
    const ri={'p1':0,'p2':1,'p3':2,'c1':0,'c2':1,'c3':2}[s.id];
    if(s.id?.startsWith('p')&&proGrp)s.speaker=fmtName(proGrp.members[rs.proRoles[ri]]);
    else if(s.id?.startsWith('c')&&conGrp)s.speaker=fmtName(conGrp.members[rs.conRoles[ri]]);
    else if(s.id==='free')s.speaker='自由辯論';
    else if(s.id==='judge')s.speaker='校長';
    else s.speaker='—';
  });
  stepsDone=new Array(steps.length).fill(false);stepIdx=0;
  renderFlowSteps();loadStep(0);
}

function renderDebatePoints(elId,label,points,side){
  const el=document.getElementById(elId);
  el.innerHTML=`<div class="side-points-label">${label}</div>`+
    points.map((p,i)=>`
      <div class="pt-row">
        <div class="pt-icon" style="background:${side==='pro'?'var(--pro-bg)':'var(--con-bg)'}">${['⚖️','👤','💛','🔺','⚠️','📊'][i]||'•'}</div>
        <div class="pt-body">
          <div class="pt-tag" style="color:${side==='pro'?'var(--pro-icon)':'var(--con-icon)'}">${p.tag}</div>
          <div class="pt-text">${p.text}</div>
        </div>
      </div>`).join('');
}

function updateTzSide(side,grp,stance){
  const tzSide=document.getElementById('tz-side');
  const tzIcon=document.getElementById('tz-icon');
  const tzLabel=document.getElementById('tz-side-label');
  const tzStance=document.getElementById('tz-stance');
  if(side==='pro'){
    tzSide.className='tz-side pro-tz';tzIcon.textContent='🛡';
    tzLabel.textContent=(grp?.name||'正方')+'　發言中';tzLabel.style.color='var(--pro-icon)';
  } else if(side==='con'){
    tzSide.className='tz-side con-tz';tzIcon.textContent='⚔️';
    tzLabel.textContent=(grp?.name||'反方')+'　發言中';tzLabel.style.color='var(--con-icon)';
  } else {
    tzSide.className='tz-side';tzIcon.textContent='⏱';
    tzLabel.textContent='校長總評';tzLabel.style.color='var(--text-dim)';
  }
  tzStance.textContent=stance||'';
}

function renderFlowSteps(){
  const el=document.getElementById('flow-steps');el.innerHTML='';
  steps.forEach((s,i)=>{
    if(i>0){const dash=document.createElement('div');dash.className='flow-dash';el.appendChild(dash);}
    const step=document.createElement('div');
    step.className='flow-step'+(i===stepIdx?' active':stepsDone[i]?' done':'');
    step.innerHTML=`
      <div class="flow-step-bubble">${String(i+1).padStart(2,'0')}</div>
      <div class="flow-step-name">${s.label}</div>
      <div class="flow-step-time">${s.id==='free'?'4:00':fmt(s.secs)}</div>`;
    step.onclick=()=>{if(tRun)timerPause();stepsDone[stepIdx]=true;stepIdx=i;loadStep(i);};
    el.appendChild(step);
  });
}

function loadStep(i){
  stopAll();const s=steps[i];isJudge=(s.id==='judge');
  const isFree=s.id==='free';
  document.getElementById('timer-zone').style.display=isFree?'none':'block';
  document.getElementById('fd-zone').className='fd-zone'+(isFree?' vis':'');
  document.getElementById('fd-btns').style.display=isFree?'flex':'none';
  document.getElementById('btn-ts').style.display=isFree?'none':'inline-flex';
  document.getElementById('btn-tp').style.display='none';
  if(isFree){fdProTotal=120;fdConTotal=120;fdSide=null;fdRun=false;fdSpeechLeft=30;updateFd();}
  else{
    tLeft=s.secs;tTotal=s.secs;
    document.getElementById('tz-speaker').textContent=s.speaker||'—';
    document.getElementById('tz-step').textContent=s.label+(s.sub?'　·　'+s.sub:'');
    document.getElementById('tz-time').textContent=fmt(tLeft);
    document.getElementById('tz-time').className='tz-time';
    document.getElementById('tz-bar').style.width='100%';
    document.getElementById('tz-bar').className='tz-bar';
    const rs=rounds[curRound];
    const proGrp=cfg.groups[rs.proGrpIdx];const conGrp=cfg.groups[rs.conGrpIdx];
    const td=rs.topicIdx!=null?TD[rs.topicIdx]:null;
    if(s.side==='pro')updateTzSide('pro',proGrp,td?.pro_stance||'');
    else if(s.side==='con')updateTzSide('con',conGrp,td?.con_stance||'');
    else if(s.side==='judge')updateTzSide('judge',null,'');
    else updateTzSide('pro',proGrp,td?.pro_stance||'');
  }
  renderFlowSteps();
}

function timerStart(){
  if(tRun)return;tRun=true;
  document.getElementById('btn-ts').style.display='none';
  document.getElementById('btn-tp').style.display='inline-flex';
  tIv=setInterval(()=>{
    tLeft--;const pct=(tLeft/tTotal)*100;
    const td_el=document.getElementById('tz-time');const bar=document.getElementById('tz-bar');
    td_el.textContent=fmt(tLeft);bar.style.width=pct+'%';
    if(isJudge){
      if(tLeft<=30&&tLeft>0){td_el.className='tz-time judge-warn';bar.className='tz-bar judge-warn';}
      else if(tLeft<=0){td_el.className='tz-time judge-danger';}
      else{td_el.className='tz-time';bar.className='tz-bar';}
    } else {
      if(tLeft<=10&&tLeft>0){td_el.className='tz-time danger';bar.className='tz-bar danger';warnBeep();}
      else if(tLeft<=30){td_el.className='tz-time warn';bar.className='tz-bar warn';}
      else{td_el.className='tz-time';bar.className='tz-bar';}
    }
    if(tLeft<=0){clearInterval(tIv);tRun=false;if(!isJudge)endBeep();document.getElementById('btn-ts').style.display='inline-flex';document.getElementById('btn-tp').style.display='none';}
  },1000);
}
function timerPause(){tRun=false;clearInterval(tIv);document.getElementById('btn-ts').style.display='inline-flex';document.getElementById('btn-tp').style.display='none';}
function timerReset(){timerPause();tLeft=tTotal;document.getElementById('tz-time').textContent=fmt(tLeft);document.getElementById('tz-time').className='tz-time';document.getElementById('tz-bar').style.width='100%';document.getElementById('tz-bar').className='tz-bar';}
function timerNext(){timerPause();stepsDone[stepIdx]=true;if(stepIdx<steps.length-1){stepIdx++;loadStep(stepIdx);}else showEndModal();}

function fdStart(side){
  if(side==='pro'&&fdProTotal<=0){toast('正方時間已用完');return;}
  if(side==='con'&&fdConTotal<=0){toast('反方時間已用完');return;}
  fdStop();fdRun=true;fdSide=side;fdSpeechLeft=30;
  document.getElementById('fd-pro').classList.toggle('active-fd',side==='pro');
  document.getElementById('fd-con').classList.toggle('active-fd',side==='con');
  fdIv=setInterval(()=>{
    fdSpeechLeft--;
    if(fdSide==='pro')fdProTotal--;else fdConTotal--;
    if(fdSpeechLeft<=10&&fdSpeechLeft>0)warnBeep();
    if(fdSpeechLeft<=0){endBeep();fdStop();}
    else if(fdProTotal<=0||fdConTotal<=0){fdStop();}
    updateFd();
  },1000);updateFd();
}
function fdStop(){fdRun=false;clearInterval(fdIv);fdSide=null;document.getElementById('fd-pro').classList.remove('active-fd');document.getElementById('fd-con').classList.remove('active-fd');}
function updateFd(){
  const pt=document.getElementById('fd-pro-total'),ct=document.getElementById('fd-con-total');
  const ps=document.getElementById('fd-pro-speech'),cs=document.getElementById('fd-con-speech');
  const pb=document.getElementById('fd-pro-bar'),cb=document.getElementById('fd-con-bar');
  pt.textContent=fmt(fdProTotal);ct.textContent=fmt(fdConTotal);
  pt.className='fd-total'+(fdProTotal<=10?' danger':fdProTotal<=30?' warn':'');
  ct.className='fd-total'+(fdConTotal<=10?' danger':fdConTotal<=30?' warn':'');
  const sv=fdRun?fdSpeechLeft:30;const sp=(sv/30)*100;
  if(fdSide==='pro'){
    ps.textContent=fmt(sv);pb.style.width=sp+'%';
    ps.className='fd-speech-time'+(sv<=5?' danger':sv<=10?' warn':'');
    pb.className='fd-bar'+(sv<=5?' danger':sv<=10?' warn':'');
  } else {ps.textContent='0:30';pb.style.width='100%';ps.className='fd-speech-time';pb.className='fd-bar';}
  if(fdSide==='con'){
    cs.textContent=fmt(sv);cb.style.width=sp+'%';
    cs.className='fd-speech-time'+(sv<=5?' danger':sv<=10?' warn':'');
    cb.className='fd-bar'+(sv<=5?' danger':sv<=10?' warn':'');
  } else {cs.textContent='0:30';cb.style.width='100%';cs.className='fd-speech-time';cb.className='fd-bar';}
  document.getElementById('fd-btn-pro').disabled=fdProTotal<=0;
  document.getElementById('fd-btn-con').disabled=fdConTotal<=0;
}

function stopAll(){clearInterval(tIv);clearInterval(fdIv);tRun=false;fdRun=false;}

function showEndModal(){
  document.getElementById('m-eye').textContent='本場結束';document.getElementById('m-ttl').textContent='全部環節完成';
  document.getElementById('m-slots').innerHTML='';document.getElementById('m-note').textContent='';
  const mb=document.getElementById('m-btns');mb.innerHTML='';
  if(curRound<2){const btn=document.createElement('button');btn.className='btn btn-navy';btn.textContent=`前往第 ${curRound+2} 場`;btn.onclick=()=>{closeModal();switchRound(curRound+1);};mb.appendChild(btn);}
  const cb=document.createElement('button');cb.className='btn btn-outline';cb.textContent='關閉';cb.onclick=closeModal;mb.appendChild(cb);
  document.getElementById('modal').classList.add('open');
}

// ── INIT ──
renderRoundBar();showDraw();
</script>
</body>
