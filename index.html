  return '<span class="tg tg-ch sampler">Sampler 管道</span>';
}
function attHist(p,si){return p.history&&p.history[si]?true:false;}
function hasReplay(p,si){
  if(!p.overview||!C.track)return false;
  const prog=p.overview.sections.find(s=>s.type==='progress');
  if(!prog)return false;
  const t=prog.progress.find(pr=>pr.label.indexOf(C.track)>=0);
  if(!t)return false;
  return t.levels.indexOf(si+1)>=0;
}
function sessState(p,si){
  const att=attHist(p,si),rep=hasReplay(p,si);
  if(att&&rep)return {cls:'st-full',txt:'出席·有回放'};
  if(att&&!rep)return {cls:'st-norep',txt:'出席·無回放'};
  if(!att&&rep)return {cls:'st-rep',txt:'缺席·有回放'};
  return {cls:'st-none',txt:'缺席·無回放'};
}

// ── 學習密度分類 ──
function classify(p){
  const histSessions=SESSIONS.filter(s=>!s.editable);
  const total=histSessions.length||1;
  let attended=0,replayed=0;
  histSessions.forEach((s,si)=>{if(attHist(p,si))attended++;if(hasReplay(p,si))replayed++;});
  const attRate=attended/total;
  const recent=p.overview&&p.overview.recentPurchase?p.overview.recentPurchase:'';
  // 最近購課是否在30天內（簡化：字串比對年月）
  let recentActive=false;
  if(recent){
    const d=new Date(recent.replace(/\//g,'-').slice(0,10));
    if(!isNaN(d)){const days=(Date.now()-d.getTime())/86400000;recentActive=days<=30;}
  }
  if(attRate>=0.8&&recentActive)return 'green';
  if(attRate===0&&replayed===0&&!recentActive)return 'red';
  if(attRate<0.4&&replayed===0&&!recentActive)return 'red';
  return 'yellow';
}
const GROUP_META={
  green:{icon:'🟢',title:'高度活躍',desc:'過往出席率高且近期有購課，可邀請分享或延伸交流'},
  yellow:{icon:'🟡',title:'中等',desc:'部分出席或有補回放，可關心進度'},
  red:{icon:'🔴',title:'需關注',desc:'出席率低、未補回放、近期無購課 — 今天若有來，建議重點互動'}
};

function setG(g,btn){curG=g;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  let pool=PEOPLE.filter(p=>!q||p.name.toLowerCase().includes(q));
  pool.forEach(p=>{p.__g=classify(p);});
  const list=document.getElementById('list');list.innerHTML='';

  if(curG==='all'){
    ['green','yellow','red'].forEach(g=>{
      const items=pool.filter(p=>p.__g===g);
      if(!items.length)return;
      renderGroup(g,items,list);
    });
  }else{
    const items=pool.filter(p=>p.__g===curG);
    renderGroup(curG,items,list);
  }
  if(!list.children.length)list.innerHTML='<div class="empty" style="padding:30px 0;text-align:center">沒有符合的學員</div>';
}

function renderGroup(g,items,list){
  const meta=GROUP_META[g];
  const gh=document.createElement('div');
  gh.className='group';
  gh.innerHTML='<div class="group-h"><span class="group-icon">'+meta.icon+'</span><span class="group-t">'+meta.title+'</span><span class="group-c">'+items.length+' 人</span></div><div class="group-desc">'+meta.desc+'</div>';
  list.appendChild(gh);
  items.forEach(p=>{
    const card=document.createElement('div');
    card.className='card';
    let sm='';
    SESSIONS.forEach((s,si)=>{
      if(s.editable)return; // 會前版只顯示歷史場次
      const st=sessState(p,si);
      sm+='<span class="st '+st.cls+'"><span class="stm">'+s.label+'</span>'+st.txt+'</span>';
    });
    const tags=[];
    const chL=channelLabel(p);if(chL)tags.push(chL);
    if(p.academy){
      tags.push('<span class="tg tg-lv">'+(p.academy.level||'')+'</span>');
      tags.push('<span class="tg tg-spend">剩餘 '+fmt(p.academy.remaining)+'</span>');
    }else{
      tags.push('<span class="tg tg-spend">'+fmt(p.samplerTotal)+'</span>');
    }
    card.innerHTML='<div class="chead" onclick="toggle(this,&#39;'+p.email+'&#39;)"><span class="cname">'+p.name+'<span class="chevron" id="chev-'+eid(p.email)+'">▾</span></span><div class="ctags">'+tags.join('')+'</div><div class="sess-mini">'+sm+'</div></div>'+
      '<div class="cbody" id="cb-'+eid(p.email)+'"></div>';
    list.appendChild(card);
  });
}

function toggle(el,email){
  const body=document.getElementById('cb-'+eid(email));
  const chev=document.getElementById('chev-'+eid(email));
  const open=body.classList.contains('open');
  // collapse all others
  document.querySelectorAll('.cbody.open').forEach(b=>{b.classList.remove('open');b.innerHTML='';});
  document.querySelectorAll('.chevron').forEach(c=>c.textContent='▾');
  if(!open){
    const p=PEOPLE.find(x=>x.email===email);
    body.innerHTML=detailHTML(p);
    body.classList.add('open');
    chev.textContent='▴';
  }
}

function collapse(title,summary,body){const id='x'+Math.random().toString(36).slice(2,8);return '<div class="cs" onclick="var e=document.getElementById(&#39;'+id+'&#39;);e.classList.toggle(&#39;open&#39;)"><span>'+title+'</span><span class="ct">'+summary+' ▾</span></div><div class="cb" id="'+id+'">'+body+'</div>';}

function detailHTML(p){
  const ov=p.overview;const isAc=personIsAcademy(p);let h='';
  const top=[];
  if(p.academy){top.push('<div class="hl-box"><div class="hl-v">'+(p.academy.level||'—')+'</div><div class="hl-l">Academy 等級</div></div>');top.push('<div class="hl-box"><div class="hl-v">'+fmt(p.academy.remaining)+'</div><div class="hl-l">剩餘點數</div></div>');}
  const rec=ov&&ov.recentPurchase?ov.recentPurchase.slice(0,10):'—';
  top.push('<div class="hl-box"><div class="hl-v">'+rec+'</div><div class="hl-l">最近購課</div></div>');
  top.push('<div class="hl-box"><div class="hl-v">'+(isAc&&p.academy?fmt(p.academy.total_stored):fmt(p.samplerTotal))+'</div><div class="hl-l">'+(isAc&&p.academy?'Academy 總儲值':'Sampler 消費')+'</div></div>');
  h+='<div class="hl-row">'+top.join('')+'</div>';

  // 歷史出席（四態）
  const hist=SESSIONS.filter(s=>!s.editable);
  if(hist.length){
    h+='<div style="margin-bottom:10px">';
    SESSIONS.forEach((s,si)=>{
      if(s.editable)return;
      const st=sessState(p,si);
      h+='<div class="sess-hist-row"><span>'+s.label+(s.date?' · '+s.date:'')+'</span><span class="st '+st.cls+'">'+st.txt+'</span></div>';
    });
    h+='</div>';
  }

  if(C.track&&ov){const prog=ov.sections.find(s=>s.type==='progress');const t=prog?prog.progress.find(pr=>pr.label.indexOf(C.track)>=0):null;h+='<div class="track-hero"><div class="track-t">本堂課重點 · '+C.track+' 回放</div>';if(t){const mx=Math.max.apply(null,t.levels);let c='';for(let lv=1;lv<=mx;lv++)c+='<span class="lv '+(t.levels.indexOf(lv)>=0?'y':'n')+'">M'+lv+'</span>';h+='<div class="prow"><div class="tags">'+c+'</div><b style="color:var(--gold)">'+t.levels.length+' 級</b></div>';}else h+='<div class="empty">尚無 '+C.track+' 複習紀錄</div>';h+='</div>';}

  const gc=(t)=>ov?ov.sections.find(s=>s.type==='certs'&&s.title===t):null;
  const gl=(kw)=>ov?ov.sections.find(s=>s.type==='courselist'&&s.title.indexOf(kw)>=0):null;
  const sub=ov?ov.sections.find(s=>s.type==='subcats'):null;
  if(ov){
    const prog=ov.sections.find(s=>s.type==='progress');
    if(prog&&prog.progress.length&&!C.track){let b='';prog.progress.forEach(pr=>{const mx=Math.max.apply(null,pr.levels);let c='';for(let lv=1;lv<=mx;lv++)c+='<span class="lv '+(pr.levels.indexOf(lv)>=0?'y':'n')+'">M'+lv+'</span>';b+='<div class="prow"><div class="pn">'+pr.label+'</div><div class="tags">'+c+'</div></div>';});h+=collapse('回放',prog.progress.length+' 專場',b);}
    h+='<div class="glabel">錄播課程：主題精修</div>';
    const mn=gl('正課');if(mn)h+=collapse('正課區',mn.items.length+' 堂',mn.items.length?'<div style="font-size:12px;color:var(--muted);columns:2">'+mn.items.map(x=>'<div>· '+x+'</div>').join('')+'</div>':'<div class="empty">無</div>');
    if(sub){const tot=sub.subcats.reduce((a,kv)=>a+kv[1],0);h+=collapse('案例專區',tot+' 集',sub.subcats.map(kv=>'<div class="kv"><span class="k">'+kv[0]+'</span><span>'+kv[1]+' 集</span></div>').join(''));}
    const ai=gc('AI 應用專區');if(ai)h+=collapse('AI應用專區',ai.items.length+' 堂',ai.items.length?'<div class="tags">'+ai.items.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div>':'<div class="empty">無</div>');
    if(ov.metrics['廣播集數']!=null)h+='<div class="cs" style="cursor:default"><span>廣播專區</span><span class="ct">'+ov.metrics['廣播集數']+' 集</span></div>';
    h+='<div class="glabel">即時交流：資格證</div>';
    const pv=gc('私享專場 · 2026');if(pv)h+=collapse('私享專場',pv.items.length+' 堂',pv.items.length?'<div class="tags">'+pv.items.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div>':'<div class="empty">無</div>');
    const lg=gc('付費直播 · 2025前');if(lg)h+=collapse('付費直播',lg.items.length+' 堂',lg.items.length?'<div class="tags">'+lg.items.map(x=>'<span class="tag legacy">'+x+'</span>').join('')+'</div>':'<div class="empty">無</div>');
    const lt=gc('限時專區 · Live Talk');if(lt)h+=collapse('Live Talk',lt.items.length+' 堂',lt.items.length?'<div class="tags">'+lt.items.map(x=>'<span class="tag live">'+x+'</span>').join('')+'</div>':'<div class="empty">無</div>');
    const tr=gc('訓練營 · 受訓資格證'),ls=gc('訓練營 · 聆聽資格證');
    if(tr||ls){const tc=tr?tr.items.length:0,lc=ls?ls.items.length:0;let b='<div style="margin-bottom:6px"><div style="font-size:12px;font-weight:600;margin-bottom:3px">‧ 受訓資格證（'+tc+'）</div>'+(tc?'<div class="tags">'+tr.items.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div>':'<div class="empty">無</div>')+'</div><div><div style="font-size:12px;font-weight:600;margin-bottom:3px">‧ 聆聽資格證（'+lc+'）</div>'+(lc?'<div class="tags">'+ls.items.map(x=>'<span class="tag live">'+x+'</span>').join('')+'</div>':'<div class="empty">無</div>')+'</div>';h+=collapse('訓練營','受訓 '+tc+' / 聆聽 '+lc,b);}
    const act=gc('限時專區 · 活動參與');if(act)h+=collapse('現場活動',act.items.length+' 次',act.items.length?'<div class="tags">'+act.items.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div>':'<div class="empty">無</div>');
    const rf=gl('精煉');if(rf)h+=collapse('精煉研習班',rf.items.length+' 堂',rf.items.length?'<div style="font-size:12px;color:var(--muted)">'+rf.items.map(x=>'<div>· '+x+'</div>').join('')+'</div>':'<div class="empty">無</div>');
  }
  if(p.academy){let b='<div class="kv"><span class="k">總儲值</span><span>'+fmt(p.academy.total_stored)+'</span></div><div class="kv"><span class="k">等級到期</span><span>'+(p.academy.expire||'—')+'</span></div>'+(p.academy.ig?'<div class="kv"><span class="k">IG</span><span>@'+p.academy.ig+'</span></div>':'');h+='<div class="glabel">Academy 帳戶</div>'+collapse('帳戶明細',p.academy.level||'',b);}
  let sb='';if(p.samplerCount>0){SAMPLER_CATS.concat(['其他']).forEach(cat=>{if(p.samplerCats[cat]&&p.samplerCats[cat].length)sb+='<div style="margin-bottom:6px"><span style="font-size:10px;color:var(--gold);font-weight:600">'+cat+'</span><div class="tags" style="margin-top:3px">'+p.samplerCats[cat].map(x=>'<span class="tag">'+x+'</span>').join('')+'</div></div>';});}else sb='<div class="empty">無 Sampler 購課</div>';
  h+='<div class="glabel">Sampler 購課'+(isAc?'（補充）':'')+'</div>'+collapse('Sampler 購課',p.samplerCount+' 堂 · '+fmt(p.samplerTotal),sb);
  return h;
}

render();
</script>
